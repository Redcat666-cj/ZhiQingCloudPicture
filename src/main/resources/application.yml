server:
  port: 8123
  servlet:
    context-path: /api
  reactive:
    session:
      #前端cookie同步reids
      cookie:
        max-age: 259200

spring:
  profiles:
    active: local
  application:
    name: zhiqin-picture
  datasource:
    # 单库 + MyBatis-Plus 动态表名：picture 逻辑表会被路由到 picture_public / picture_{spaceId}
    # 分表规则见 com.zhiqin.zhiqinpicturebackend.manager.table 包，建表脚本见 sql/space_table_init.sql
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "061214"
    url: jdbc:mysql://localhost:3306/zhiqin_picture
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
  session:
    store-type: redis
    #30天后过期
    timeout: 259200
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.zhiqin.zhiqinpicturebackend.controller
